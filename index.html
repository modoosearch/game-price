<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게임머니 시세 중계</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f0f12;
      --bg-card: #18181c;
      --border: #2a2a30;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --up: #22c55e;
      --down: #ef4444;
      --accent: #a78bfa;
      --font: 'Noto Sans KR', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { max-width: 1200px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
    .badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; background: var(--border); color: var(--text-muted); }
    .summary-section { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-width: 260px; }
    .card-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }
    .card-price strong { color: var(--accent); font-size: 1.25rem; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }
    .change { margin-top: 10px; font-size: 0.95rem; font-weight: 600; }
    .change.up { color: var(--up); }
    .change.down { color: var(--down); }
    .chart-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .chart-wrap h3 { font-size: 0.95rem; margin: 0 0 12px 0; }
    .chart-container { height: 260px; position: relative; }
    .grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .trades-wrap { max-height: 320px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--bg-card); }
    .empty { color: var(--text-muted); text-align: center; padding: 24px; }
    .chat-msgs { min-height: 200px; max-height: 280px; overflow-y: auto; padding: 8px 0; }
    .chat-msg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 0.88rem; margin-bottom: 8px; }
    .chat-nick { color: var(--accent); font-weight: 500; }
    .chat-time { color: var(--text-muted); font-size: 0.75rem; margin-left: auto; }
    .chat-inputs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .chat-inputs input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.9rem; }
    .chat-inputs input:nth-child(1) { width: 80px; }
    .chat-inputs input:nth-child(2) { flex: 1; min-width: 120px; }
    .chat-send { padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 500; cursor: pointer; }
    .parse-btn { margin-left: auto; padding: 8px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    .parse-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .parse-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .parse-status { font-size: 0.8rem; margin-left: 8px; }
    .parse-status.ok { color: var(--up); }
    .parse-status.err { color: var(--down); }
    .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>게임머니 시세 중계</h1>
      <span class="badge">테스트 (정적)</span>
      <button type="button" class="parse-btn" id="parseBtn">지금 수집</button>
      <span class="parse-status" id="parseStatus"></span>
    </header>

    <section class="summary-section">
      <div class="card">
        <div class="card-title">바로템</div>
        <div class="card-price">평균 <strong id="avgPrice">-</strong> 원</div>
        <div class="card-meta" id="summaryMeta">거래건수 0 · 거래량 0 · 총액 0만원</div>
        <div class="change up" id="changeEl" style="display:none;"></div>
      </div>
    </section>

    <div class="chart-wrap">
      <h3>시세 (1분 단위)</h3>
      <div class="chart-container"><canvas id="chart"></canvas></div>
    </div>

    <section class="grid2">
      <div class="card">
        <h3 style="margin:0 0 12px 0; font-size:0.95rem">최근 거래</h3>
        <div class="trades-wrap">
          <table>
            <thead><tr><th>사이트</th><th>거래양</th><th>금액</th><th>시간</th></tr></thead>
            <tbody id="tradesBody"><tr><td colspan="4" class="empty">거래 데이터 없음 (서버 없음)</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px 0; font-size:0.95rem">채팅 (브라우저 저장)</h3>
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-inputs">
          <input type="text" id="chatNick" placeholder="닉네임" maxlength="20" />
          <input type="text" id="chatInput" placeholder="메시지..." />
          <button type="button" class="chat-send" id="chatSend">전송</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      일반 웹호스팅 테스트용 · 시세/거래는 서버 연동 시 표시됩니다.
    </footer>
  </div>

  <script>
    (function() {
      var STORAGE_KEY = 'game_chat';
      var API = 'https://weddingalarm.kr/test';

      // 수동 수집 버튼
      function setStatus(msg, isError) {
        var el = document.getElementById('parseStatus');
        el.textContent = msg || '';
        el.className = 'parse-status ' + (isError ? 'err' : 'ok');
      }
      document.getElementById('parseBtn').onclick = function() {
        var btn = this;
        btn.disabled = true;
        btn.textContent = '수집 중…';
        setStatus('');
        fetch(API + '/api/parse/barotem', { method: 'POST' })
          .then(function(r) {
            if (!r.ok) throw new Error('서버 오류 ' + r.status);
            return r.json();
          })
          .then(function(result) {
            var count = (result && result.count) != null ? result.count : 0;
            setStatus('수집 완료 (' + count + '건)');
            return fetch(API + '/api/summary');
          })
          .then(function(r) {
            if (!r.ok) return;
            return r.json();
          })
          .then(function(data) {
            if (!data) return;
            var b = data.barotem;
            if (b) {
              document.getElementById('avgPrice').textContent = (b.avgPrice != null ? Number(b.avgPrice).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) : '-');
              document.getElementById('summaryMeta').textContent = '거래건수 ' + (b.count || 0) + ' · 거래량 ' + (b.totalQuantity != null ? Number(b.totalQuantity).toLocaleString() : 0) + ' · 총액 ' + (b.totalAmount != null ? (b.totalAmount / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) : 0) + '만원';
              var changeEl = document.getElementById('changeEl');
              if (b.changePercent != null) {
                changeEl.style.display = 'block';
                changeEl.textContent = (b.changePercent >= 0 ? '▲ +' : '▼ ') + Number(b.changePercent).toFixed(2) + '%';
                changeEl.className = 'change ' + (b.changePercent >= 0 ? 'up' : 'down');
              }
            }
            return fetch(API + '/api/trades?limit=50');
          })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(trades) {
            if (!trades || !trades.length) return;
            var tbody = document.getElementById('tradesBody');
            tbody.innerHTML = trades.slice(0, 20).map(function(t) {
              return '<tr><td>' + (t.source || '바로템') + '</td><td>' + (t.quantity != null ? Number(t.quantity).toLocaleString() : '-') + '</td><td>' + (t.price != null ? Number(t.price).toLocaleString() : '-') + ' 원</td><td>' + (t.time ? new Date(t.time).toLocaleTimeString('ko-KR') : '-') + '</td></tr>';
            }).join('');
          })
          .catch(function(e) {
            setStatus('실패: ' + (e.message || '연결할 수 없음'), true);
          })
          .finally(function() {
            btn.disabled = false;
            btn.textContent = '지금 수집';
          });
      };

      function loadChat() {
        try {
          var s = localStorage.getItem(STORAGE_KEY);
          return s ? JSON.parse(s) : [];
        } catch (e) { return []; }
      }
      function saveChat(arr) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr.slice(0, 100))); } catch (e) {}
      }

      // Mock 시세 (데모용)
      var mockHistory = [];
      var now = Date.now();
      for (var i = 24; i >= 0; i--) {
        mockHistory.push({
          time: new Date(now - i * 60000).toISOString(),
          avgPrice: 125 + Math.random() * 10,
          totalQuantity: Math.floor(Math.random() * 5000),
          count: Math.floor(Math.random() * 20)
        });
      }
      var last = mockHistory[mockHistory.length - 1];
      var prev = mockHistory[mockHistory.length - 2];
      var changePct = prev ? ((last.avgPrice - prev.avgPrice) / prev.avgPrice * 100).toFixed(2) : null;

      document.getElementById('avgPrice').textContent = last.avgPrice.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      document.getElementById('summaryMeta').textContent = '거래건수 ' + last.count + ' · 거래량 ' + last.totalQuantity.toLocaleString() + ' · 총액 ' + (last.avgPrice * last.count).toFixed(0) + '만원';
      var changeEl = document.getElementById('changeEl');
      if (changePct !== null) {
        changeEl.style.display = 'block';
        changeEl.textContent = (changePct >= 0 ? '▲ +' : '▼ ') + changePct + '%';
        changeEl.className = 'change ' + (changePct >= 0 ? 'up' : 'down');
      }

      // Chart
      var ctx = document.getElementById('chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: mockHistory.map(function(d) { return new Date(d.time).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }),
          datasets: [{ label: '평균가', data: mockHistory.map(function(d) { return d.avgPrice; }), borderColor: '#a78bfa', backgroundColor: 'transparent', tension: 0.3, fill: false }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#71717a', maxTicksLimit: 10 } },
            y: { ticks: { color: '#71717a' } }
          }
        }
      });

      // 채팅
      function renderChat() {
        var list = loadChat();
        var el = document.getElementById('chatMsgs');
        if (list.length === 0) { el.innerHTML = '<div class="empty">메시지 없음</div>'; return; }
        el.innerHTML = list.map(function(m) {
          return '<div class="chat-msg"><span class="chat-nick">' + escapeHtml(m.nick) + '</span> <span>' + escapeHtml(m.msg) + '</span> <span class="chat-time">' + m.time + '</span></div>';
        }).join('');
      }
      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      document.getElementById('chatSend').onclick = function() {
        var nick = (document.getElementById('chatNick').value || '익명').trim().slice(0, 20);
        var msg = (document.getElementById('chatInput').value || '').trim().slice(0, 500);
        if (!msg) return;
        var list = loadChat();
        list.unshift({ nick: nick, msg: msg, time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
        saveChat(list);
        document.getElementById('chatInput').value = '';
        renderChat();
      };
      document.getElementById('chatInput').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('chatSend').click(); };
      renderChat();
    })();
  </script>
</body>
</html>
